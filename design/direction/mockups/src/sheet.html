<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:F;font-weight:700;src:url(fonts/f700.ttf)}

const q=new URLSearchParams(location.search),t=q.get('t')||'dark',set=q.get('set');

document.body.innerHTML=N[set].map((n,i)=>`<div class="c"><img src="shots/${set}${'ABCDE'[i]}-${t}.png"><div class="tag">${set==='fam'?'Family':'Plus'} ${n}</div></div>`).join('');
</script></body></html>
