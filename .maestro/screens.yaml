# Walks the test family through the main screens and screenshots each one.
# Run by .github/workflows/android-emulator.yml; EMAIL and PASSWORD come from
# repository secrets (the test family, never a real account).
appId: com.onki.payhas
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "I have an account"
    timeout: 60000
- takeScreenshot: 00-welcome
- tapOn: "I have an account"
- extendedWaitUntil:
    visible: "English"
    timeout: 20000
- tapOn: "English"
- takeScreenshot: 01-language
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Parent sign in"
    timeout: 20000
- takeScreenshot: 02-sign-in
- tapOn: "Email"
- inputText: ${EMAIL}
- tapOn: "Password.*"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    id: "sign-in-submit"
- extendedWaitUntil:
    visible: "Who’s watching?"
    timeout: 30000
- takeScreenshot: 03-who
# Parent dashboard behind the PIN (test PIN).
- tapOn:
    id: "who-dashboard"
- extendedWaitUntil:
    visible: "2"
    timeout: 10000
- tapOn: "2"
- tapOn: "5"
- tapOn: "8"
- tapOn: "0"
- extendedWaitUntil:
    visible: "Family"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: 04-family
- scroll
- takeScreenshot: 05-family-scrolled
# iOS has no system back button; the header's back works on both.
- tapOn:
    id: "header-back"
- extendedWaitUntil:
    visible: "Who’s watching?"
    timeout: 20000
- tapOn: "Aylar.*"
- extendedWaitUntil:
    visible: "For you"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: 06-home
- tapOn:
    id: "tab-discover"
- waitForAnimationToEnd
- takeScreenshot: 07-discover
- tapOn:
    id: "tab-play"
- waitForAnimationToEnd
- takeScreenshot: 08-play
- scroll
- takeScreenshot: 09-play-scrolled
- tapOn:
    id: "tab-me"
- waitForAnimationToEnd
- takeScreenshot: 10-me
- tapOn: "Inbox.*"
- waitForAnimationToEnd
- takeScreenshot: 11-inbox
