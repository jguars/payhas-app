# Builds a signed iPhone app on a macOS runner and uploads it to TestFlight,
# on every push to plus (or by hand from the Actions tab). Install the
# TestFlight app on the iPhone; the build appears there after Apple's
# processing (usually 10–30 minutes).
#
# Signing is automatic: Xcode creates/fetches the certificate and profile
# with an App Store Connect API key (team M4V4D8KSX3). Needs three repository
# secrets — until all exist the job skips itself:
#   ASC_KEY_ID      the key's ID (Users and Access → Integrations → Team Keys)
#   ASC_ISSUER_ID   the Issuer ID shown above the key list
#   ASC_KEY_P8      the whole downloaded AuthKey_XXXX.p8 file, as text
# The app record com.onki.payhas must exist in App Store Connect (My Apps → +).
name: iOS TestFlight

on:
  push:
    branches: [plus]
  workflow_dispatch:

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ready:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          A: ${{ secrets.ASC_KEY_ID }}
          B: ${{ secrets.ASC_ISSUER_ID }}
          C: ${{ secrets.ASC_KEY_P8 }}
        run: echo "ok=$([ -n "$A" ] && [ -n "$B" ] && [ -n "$C" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  testflight:
    needs: ready
    if: ${{ needs.ready.outputs.ok == 'true' }}
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: cp .env.example .env

      - run: npx expo prebuild --platform ios

      - name: Write the API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      # Every upload needs a new build number; the run number only grows.
      - name: Set the build number
        run: /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" ios/Payhas/Info.plist

      - name: Archive (signed automatically)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -version
          xcodebuild -workspace ios/Payhas.xcworkspace -scheme Payhas -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Payhas.xcarchive \
            DEVELOPMENT_TEAM=M4V4D8KSX3 CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive -quiet

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > build/ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>M4V4D8KSX3</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/Payhas.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove the key
        if: always()
        run: rm -rf ~/.appstoreconnect
